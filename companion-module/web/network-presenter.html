<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JC AV Timer — Presenter</title><style>
:root{--bg:#00324b;--bgL:#386075;--bgD:#002131;--fg:#f5f5f5;--warn:#ff3030;--scale:1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.hidden{display:none!important}.stage{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;position:relative;padding:4vh 5vw 5vh;background:radial-gradient(circle at top,var(--bgL),var(--bg) 48%,var(--bgD));color:var(--fg)}.head{display:flex;justify-content:space-between;gap:3vw;align-items:flex-start}.queue-name{font-size:clamp(1rem,2.1vw,2.3rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.78}.state{font-size:clamp(.9rem,1.5vw,1.6rem);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.center{display:flex;flex-direction:column;align-items:center;justify-content:center}.timer{font-size:calc(clamp(5rem,23vmin,24rem)*var(--scale));font-weight:950;font-variant-numeric:tabular-nums;line-height:.9;text-shadow:.02em .02em .06em rgba(0,0,0,.5)}.timer.warn{color:var(--warn)}.timer.flash{animation:flash .75s steps(1,end) infinite}.warning{margin-bottom:2vmin;font-size:clamp(1rem,2.2vmin,2.3rem);font-weight:950;letter-spacing:.18em;text-transform:uppercase;color:var(--warn)}.items{display:grid;grid-template-columns:1fr 1fr;gap:3vw}.item{padding:1.5vmin 2vmin;border-top:1px solid rgba(255,255,255,.25)}.label{font-size:clamp(.75rem,1.1vw,1.1rem);font-weight:900;letter-spacing:.16em;opacity:.58}.name{margin-top:.5vmin;font-size:clamp(1.2rem,2.6vw,3rem);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message{position:absolute;inset:auto 4vw 4vh;padding:2.5vmin 3vmin;border-radius:1.5vmin;text-align:center;font-size:clamp(2.3rem,7vmin,7rem);font-weight:950;line-height:1.04;background:rgba(0,0,0,.82);color:#fff;white-space:pre-wrap;box-shadow:0 2vh 7vh rgba(0,0,0,.45)}.message.full{inset:0;border-radius:0;display:flex;align-items:center;justify-content:center;padding:8vw;font-size:clamp(3rem,11vmin,11rem)}.message.flash{animation:flash .75s steps(1,end) infinite}.hotspot{position:fixed;right:0;bottom:0;width:140px;height:110px;z-index:50;display:flex;align-items:flex-end;justify-content:flex-end;padding:14px}.fs{opacity:0;pointer-events:none;background:rgba(0,0,0,.78);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 14px;font-weight:800}.hotspot:hover .fs{opacity:1;pointer-events:auto}@keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.12}}
</style></head><body><main class="stage"><header class="head"><div id="queueName" class="queue-name"></div><div id="status" class="state">READY</div></header><section class="center"><div id="warning" class="warning hidden"></div><div id="timer" class="timer">00:00</div></section><footer class="items"><div class="item"><div class="label">CURRENT</div><div id="current" class="name">—</div></div><div class="item"><div class="label">NEXT</div><div id="next" class="name">—</div></div></footer><div id="message" class="message hidden"></div></main><div class="hotspot"><button id="fs" class="fs">Fullscreen</button></div><script>
(()=>{const $=id=>document.getElementById(id);let payload=null;function mix(a,b,t){a=(a||'').replace('#','');b=(b||'').replace('#','');if(!/^[0-9a-f]{6}$/i.test(a)||!/^[0-9a-f]{6}$/i.test(b))return '#00324b';let o='#';for(let i=0;i<3;i++){const x=parseInt(a.slice(i*2,i*2+2),16),y=parseInt(b.slice(i*2,i*2+2),16);o+=Math.round(x+(y-x)*t).toString(16).padStart(2,'0')}return o}function fmt(v){v=Math.max(0,Math.round(+v||0));const h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function live(p){const s={...(p?.state||{})};let sec=+s.seconds||0;if(s.running&&!s.paused&&+s.clockAnchorMs>0){const d=Math.max(0,(Date.now()-+s.clockAnchorMs)/1000);sec=s.countUp?Math.max(0,(+s.anchorElapsed||0)+d):Math.max(0,(+s.anchorRemaining||0)-d)}if(!s.countUp&&s.running&&sec<=0){sec=0;s.running=false;s.finished=true;s.paused=false}s.seconds=sec;s.displayTime=fmt(sec);s.status=s.finished?'TIME':s.paused?'PAUSED':s.running?'RUNNING':(+s.duration||0)>0?'ARMED':'READY';return s}function apply(p){if(!p)return;payload=p;const d=p.display||{},s=live(p),bg=d.bg||'#00324b';document.documentElement.style.cssText+=`--bg:${bg};--bgL:${mix(bg,'#fff',.22)};--bgD:${mix(bg,'#000',.34)};--fg:${d.fg||'#f5f5f5'};--warn:${s.warningColor||d.timeColor||'#ff3030'};--scale:${+d.scale||1}`;$('timer').textContent=s.displayTime||'00:00';$('timer').classList.toggle('warn',!!s.warningActive);$('timer').classList.toggle('flash',!!d.timerFlash);$('warning').textContent=s.warningLabel||'';$('warning').classList.toggle('hidden',!s.warningActive||!s.warningLabel);$('queueName').textContent=s.queueName||'';$('current').textContent=s.currentItemName||'—';$('next').textContent=s.nextItemName||'—';$('status').textContent=s.status||'READY';const m=d.presenterMessage||{};$('message').textContent=m.text||'';$('message').classList.toggle('hidden',!m.visible||!m.text);$('message').classList.toggle('flash',!!m.flash);$('message').classList.toggle('full',m.mode==='full');$('message').style.color=m.color||'#fff';$('message').style.background=m.background||'rgba(0,0,0,.82)'}async function initial(){try{const r=await fetch('/api/network/state',{cache:'no-store'});if(r.ok)apply(await r.json())}catch{}}const es=new EventSource('/api/network/stream');es.onmessage=e=>{try{apply(JSON.parse(e.data))}catch{}};setInterval(()=>{if(payload)apply(payload)},250);$('fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'Exit Fullscreen':'Fullscreen'});initial()})();
</script></body></html>
