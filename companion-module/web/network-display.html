<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JC AV Timer — Network Display</title><style>
:root{--bg:#00324b;--bgL:#386075;--bgD:#002131;--fg:#f5f5f5;--progress:#ff4b4b;--time:#ff0000;--warn:#ff0000;--scale:1;--chroma:#00ff00;--msg:#fff;--msgBg:rgba(0,0,0,.78)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.hidden{display:none!important}.stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at top,var(--bgL) 0%,var(--bg) 46%,var(--bgD) 100%);color:var(--fg)}body.flat .stage{background:var(--bg)}body.light .stage{--bg:#f5f7fb;--bgL:#fff;--bgD:#dfe7f1;--fg:#0f172a}body.chroma .stage{background:var(--chroma)!important}.warning{margin-bottom:2.5vmin;font-size:clamp(1rem,2.2vmin,2.2rem);font-weight:950;letter-spacing:.18em;text-transform:uppercase;color:var(--warn)}.timer{font-size:calc(clamp(4rem,21vmin,24rem)*var(--scale));font-weight:900;font-variant-numeric:tabular-nums;line-height:.92;text-align:center;color:var(--fg);text-shadow:.02em .02em .05em rgba(0,0,0,.55)}.timer.warn{color:var(--warn)}.timer.flash{animation:timerFlash .75s steps(1,end) infinite}.paused,.finished{margin-top:2.4vmin;font-weight:950;letter-spacing:.22em;font-size:clamp(1rem,2.5vmin,2.4rem)}.paused{color:#fbbf24}.finished{color:var(--time)}.progress{width:min(72vw,1100px);height:clamp(7px,1.2vmin,18px);background:rgba(15,23,42,.62);border:1px solid rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin-top:3vmin}.progress>div{height:100%;width:0;background:var(--progress);transition:width .1s linear}.message{position:absolute;left:5vw;right:5vw;bottom:6vh;padding:2.2vmin 3vmin;border-radius:1.4vmin;text-align:center;font-weight:950;line-height:1.05;letter-spacing:.02em;font-size:clamp(2rem,6vmin,6rem);color:var(--msg);background:var(--msgBg);box-shadow:0 2vh 6vh rgba(0,0,0,.38);white-space:pre-wrap}.message.full{inset:0;border-radius:0;display:flex;align-items:center;justify-content:center;padding:8vw;font-size:clamp(3rem,10vmin,10rem)}.message.flash{animation:messageFlash .75s steps(1,end) infinite}.minimal .timer,.minimal .paused,.minimal .finished,.minimal .warning,.minimal .message{display:none!important}.minimal .progress{display:block!important;width:82vw;height:clamp(28px,10vmin,130px)}.hotspot{position:fixed;right:0;bottom:0;width:140px;height:110px;z-index:100;display:flex;align-items:flex-end;justify-content:flex-end;padding:14px}.fs{opacity:0;pointer-events:none;border:1px solid rgba(255,255,255,.25);background:rgba(7,14,24,.82);color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.hotspot:hover .fs,.hotspot:focus-within .fs{opacity:1;pointer-events:auto}@keyframes timerFlash{0%,49%{opacity:1}50%,100%{opacity:.12}}@keyframes messageFlash{0%,49%{opacity:1}50%,100%{opacity:.16}}
</style></head><body><main class="stage"><div id="warning" class="warning hidden"></div><div id="timer" class="timer">00:00</div><div id="paused" class="paused hidden">PAUSED</div><div id="finished" class="finished hidden">TIME</div><div id="progress" class="progress hidden"><div id="bar"></div></div><div id="message" class="message hidden"></div></main><div class="hotspot"><button id="fs" class="fs">Fullscreen</button></div><script>
(()=>{const $=id=>document.getElementById(id);let payload=null;const timer=$('timer'),warn=$('warning'),paused=$('paused'),finished=$('finished'),progress=$('progress'),bar=$('bar'),message=$('message');function mix(a,b,t){a=(a||'').replace('#','');b=(b||'').replace('#','');if(!/^[0-9a-f]{6}$/i.test(a)||!/^[0-9a-f]{6}$/i.test(b))return '#00324b';let o='#';for(let i=0;i<3;i++){const x=parseInt(a.slice(i*2,i*2+2),16),y=parseInt(b.slice(i*2,i*2+2),16);o+=Math.round(x+(y-x)*t).toString(16).padStart(2,'0')}return o}function fmt(v){v=Math.max(0,Math.round(+v||0));const h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function live(p){const s={...(p?.state||{})};let sec=+s.seconds||0;if(s.running&&!s.paused&&+s.clockAnchorMs>0){const d=Math.max(0,(Date.now()-+s.clockAnchorMs)/1000);sec=s.countUp?Math.max(0,(+s.anchorElapsed||0)+d):Math.max(0,(+s.anchorRemaining||0)-d)}if(!s.countUp&&s.running&&sec<=0){sec=0;s.running=false;s.finished=true;s.paused=false}s.seconds=sec;s.displayTime=fmt(sec);const dur=Math.max(0,+s.duration||0);s.progressPercent=dur?Math.max(0,Math.min(100,sec/dur*100)):0;return s}function apply(p){if(!p)return;payload=p;const d=p.display||{},s=live(p),bg=d.bg||'#00324b';document.documentElement.style.cssText+=`--bg:${bg};--bgL:${mix(bg,'#ffffff',.22)};--bgD:${mix(bg,'#000000',.34)};--fg:${d.fg||'#f5f5f5'};--progress:${d.progress||'#ff4b4b'};--time:${d.timeColor||'#ff0000'};--warn:${s.warningColor||d.timeColor||'#ff0000'};--scale:${+d.scale||1};--chroma:${d.chromaColor||'#00ff00'};--msg:${d.messageColor||'#ffffff'};--msgBg:${d.messageBackground||'rgba(0,0,0,.78)'}`;document.body.classList.toggle('flat',d.gradient===false);document.body.classList.toggle('light',!!d.light);document.body.classList.toggle('chroma',!!d.chroma);document.body.classList.toggle('minimal',!!d.minimal);timer.textContent=s.displayTime||'00:00';timer.classList.toggle('warn',!!s.warningActive);timer.classList.toggle('flash',!!d.timerFlash);warn.textContent=s.warningLabel||'';warn.classList.toggle('hidden',!s.warningActive||!s.warningLabel);paused.classList.toggle('hidden',!s.paused);finished.classList.toggle('hidden',!s.finished);progress.classList.toggle('hidden',!(d.showProgress||d.minimal));bar.style.width=`${s.progressPercent||0}%`;const msg=d.presenterMessage||{};message.textContent=msg.text||'';message.classList.toggle('hidden',!msg.visible||!msg.text);message.classList.toggle('flash',!!msg.flash);message.classList.toggle('full',msg.mode==='full');message.style.color=msg.color||d.messageColor||'#fff';message.style.background=msg.background||d.messageBackground||'rgba(0,0,0,.78)'}async function initial(){try{const r=await fetch('/api/network/state',{cache:'no-store'});if(r.ok)apply(await r.json())}catch{}}const es=new EventSource('/api/network/stream');es.onmessage=e=>{try{apply(JSON.parse(e.data))}catch{}};es.onerror=()=>{};setInterval(()=>{if(payload)apply(payload)},250);$('fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'Exit Fullscreen':'Fullscreen'});initial()})();
</script></body></html>
