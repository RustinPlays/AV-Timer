name: Build and Publish JC AV Timer Companion v0.9.1
on:
  workflow_dispatch:
  push:
    paths:
      - 'companion-module/**'
      - '.github/workflows/build-companion.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: companion-module
        run: npm install
      - name: Test
        working-directory: companion-module
        run: npm test
      - name: Build importable Companion package
        working-directory: companion-module
        run: npm run package
      - name: Publish module to website downloads
        shell: bash
        run: |
          set -euo pipefail
          package=$(find companion-module -type f \( -name '*.tgz' -o -name '*.tar.gz' \) | head -n 1)
          if [ -z "$package" ]; then echo 'No Companion package was created'; exit 1; fi
          mkdir -p downloads
          cp "$package" downloads/JC-AV-Timer-Companion-v0.9.1.tgz
          sed -i 's@downloads/JC-AV-Timer-Companion-v0.8.7-Safe-Fix.tgz@downloads/JC-AV-Timer-Companion-v0.9.1.tgz@g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html downloads/JC-AV-Timer-Companion-v0.9.1.tgz
          if ! git diff --cached --quiet; then
            git commit -m 'Publish JC AV Timer Companion v0.9.1 website download'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: JC-AV-Timer-Companion-v0.9.1
          path: downloads/JC-AV-Timer-Companion-v0.9.1.tgz
          if-no-files-found: error
