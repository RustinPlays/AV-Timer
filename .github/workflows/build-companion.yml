name: Build and Publish JC AV Timer Companion v0.9.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'companion-module/**'
      - '.github/workflows/build-companion.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate module release metadata
        working-directory: companion-module
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const manifest = JSON.parse(fs.readFileSync('companion/manifest.json', 'utf8'))
          if (pkg.license !== 'MIT') throw Error('Companion requires package.json license MIT')
          if (manifest.license !== 'MIT') throw Error('Expected MIT package license')
          if (manifest.type !== 'connection') throw Error('Expected connection module manifest')
          if (!pkg.version.match(/^\d+\.\d+\.\d+$/)) throw Error('Invalid module version')
          console.log('Module version: '+pkg.version)
          NODE

      - name: Install dependencies
        working-directory: companion-module
        run: npm install --no-audit --no-fund

      - name: Test
        working-directory: companion-module
        run: npm test

      - name: Validate and build Companion module
        working-directory: companion-module
        run: |
          npx companion-module-check
          npm run package

      - name: Publish module to website downloads
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./companion-module/package.json').version")
          ARCHIVE="downloads/JC-AV-Timer-Companion-v${VERSION}.tgz"
          PACKAGE=$(find companion-module -maxdepth 2 -type f -name '*.tgz' -print -quit)
          if [[ -z "${PACKAGE}" ]]; then
            echo 'ERROR: The build produced no .tgz package'
            exit 1
          fi
          tar -tzf "$PACKAGE" | grep -Fx 'pkg/companion/manifest.json' >/dev/null
          mkdir -p downloads
          cp "$PACKAGE" "$ARCHIVE"
          # Update the existing website download button for this version.
          sed -i -E "s@downloads/JC-AV-Timer-Companion-v[0-9.]+(-Safe-Fix)?\.tgz@${ARCHIVE}@g" index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html "$ARCHIVE"
          if ! git diff --cached --quiet; then
            git commit -m "Publish JC AV Timer Companion v${VERSION} website download"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: JC-AV-Timer-Companion-v0.9.2
          path: downloads/JC-AV-Timer-Companion-v0.9.2.tgz
          if-no-files-found: error
