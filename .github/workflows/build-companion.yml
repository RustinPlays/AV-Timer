name: Build JC AV Timer Companion module
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install module build dependencies
        run: npm install
      - name: Validate module
        run: npm run check
      - name: Create official Companion import package
        run: npm run build
      - name: Upload resulting .tgz
        uses: actions/upload-artifact@v4
        with:
          name: jc-av-timer-companion-5.1.0-build
          path: '*.tgz'
          if-no-files-found: error
